name: Release Pele

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Verify tag matches package version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$package_version"
      - name: Check package
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Pack release
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
      - name: Check the packed entry points
        run: node scripts/check-pack.mjs release/*.tgz
      # Attestation and npm provenance need a public repository.
      - name: Generate artifact attestation
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-path: release/*
      - name: Publish to npm
        run: npm publish ./release/*.tgz --access public ${{ !github.event.repository.private && '--provenance' || '' }}
      - name: Create draft GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title="$GITHUB_REF_NAME" \
            --draft \
            release/*
